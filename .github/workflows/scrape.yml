name: Actualizar precios y publicar RivFree

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

  schedule:
    # Diario a las 08:15 UTC = 05:15 en Uruguay
    - cron: "15 8 * * *"

  workflow_dispatch:
    inputs:
      actualizar_precios:
        description: "Ejecutar los scrapers antes de publicar"
        type: boolean
        default: false
      tienda:
        description: "Tienda a actualizar (all = todas)"
        type: choice
        default: all
        options:
          - all
          - barao
          - dfa
          - mantra
          - neutral
          - oprha
          - sineriz
          - yurys

# Every job starts without write permissions. Untrusted scraping never gets a push token.
permissions:
  contents: read
concurrency:
  group: rivfree-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt -r requirements-security.txt
      - run: npm ci --ignore-scripts
      - run: python -m pip_audit -r requirements.txt --disable-pip --no-deps
      - run: python -m pip_audit -r requirements-db.txt --disable-pip --no-deps
      - run: npm audit --audit-level=low
      - run: python -m unittest discover -s tests -v
      - run: npm test && npm run test:ui

  scrape:
    needs: tests
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.actualizar_precios == true)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Scraping sin permisos de escritura
        id: scrape
        timeout-minutes: 150
        env:
          STORE: ${{ inputs.tienda || 'all' }}
          PYTHONUNBUFFERED: '1'
        shell: bash
        run: |
          set -o pipefail
          case "$STORE" in
            all) python scrapers/run_all.py 2>&1 | tee scrape.log ;;
            barao|dfa|mantra|neutral|oprha|sineriz|yurys) python scrapers/run_all.py --store "$STORE" 2>&1 | tee scrape.log ;;
            *) echo 'Tienda inválida'; exit 1 ;;
          esac
      - name: Completar datos
        if: always()
        run: |
          python scrapers/update_exchange.py
          python scrapers/publish_data.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: scraped-data
          path: |
            data/products.json
            data/meta.json
            data/exchange.json
            data/price-history.json
            data/health.json
            data/popular.json
            data/catalog-first-seen.json
            data/products/
            data/history/
            data/price-history/
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: scrape-log
          path: scrape.log
          retention-days: 7

  commit:
    needs: scrape
    if: always() && needs.scrape.result == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: scraped-data
          path: _incoming
      - name: Validar y guardar solamente JSON generados
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          for attempt in 1 2 3 4 5; do
            git -c http.extraheader="AUTHORIZATION: basic $AUTH" fetch origin main
            git reset --hard origin/main
            python tools/ci_data.py _incoming
            git add -- data/products.json data/meta.json data/exchange.json data/price-history.json data/health.json data/popular.json data/catalog-first-seen.json data/products/ data/history/ data/price-history/
            if git diff --cached --quiet; then exit 0; fi
            git -c core.hooksPath=/dev/null commit -m 'Actualizar precios'
            if git -c http.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:main; then exit 0; fi
          done
          exit 1

  alerts:
    needs: scrape
    if: always() && (needs.scrape.result == 'success' || needs.scrape.result == 'failure')
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: scraped-data
          path: _incoming
      - run: python tools/ci_data.py _incoming --health-only
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const run = require('./.github/scraper-alerts.cjs');
            await run({github, context});
      - name: Notificar salud
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          HEALTH_FAILURE_THRESHOLD: ${{ vars.HEALTH_FAILURE_THRESHOLD }}
          HEALTH_PARTIAL_THRESHOLD: ${{ vars.HEALTH_PARTIAL_THRESHOLD }}
          SCRAPE_OUTCOME: ${{ needs.scrape.result }}
        run: python tools/scraper_health_alerts.py

  build:
    needs: [tests, scrape, commit]
    if: always() && github.event_name != 'pull_request' && needs.tests.result == 'success' && (needs.scrape.result == 'skipped' || needs.commit.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      # PostgreSQL is optional: with the DATABASE_URL secret, the daily update also copies the catalog to the database.
      - name: Copiar catálogo a PostgreSQL (opcional, necesita el secreto DATABASE_URL)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "Sin el secreto DATABASE_URL: no se copia a PostgreSQL."; exit 0; fi
          python -m pip install --require-hashes --only-binary=:all: -r requirements-db.txt
          python tools/postgres_sync.py
      - run: |
          python scrapers/publish_data.py
          python scrapers/update_exchange.py
          python tools/build_public_site.py
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    needs: build
    if: always() && needs.build.result == 'success'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
