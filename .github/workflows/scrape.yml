name: Actualizar precios y publicar RivFree

on:
  push:
    branches: ["main"]

  schedule:
    # Miércoles a las 08:15 UTC = 05:15 en Uruguay
    - cron: "15 8 * * 3"

  workflow_dispatch:
    inputs:
      actualizar_precios:
        description: "Ejecutar los scrapers antes de publicar"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: rivfree-pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Python
        if: github.event_name == 'schedule' || inputs.actualizar_precios == true
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        if: github.event_name == 'schedule' || inputs.actualizar_precios == true
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Ejecutar scrapers
        if: github.event_name == 'schedule' || inputs.actualizar_precios == true
        run: python scrapers/run_all.py

      - name: Guardar productos actualizados
        if: github.event_name == 'schedule' || inputs.actualizar_precios == true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if ! git diff --staged --quiet; then
            git commit -m "Actualizar precios"
            git push
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos públicos
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r data _site/data

      - name: Subir archivos de la página
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      - name: Publicar RivFree
        id: deployment
        uses: actions/deploy-pages@v4