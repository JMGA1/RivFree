name: Actualizar precios

# Corre todos los dias a las 08:00 UTC (05:00 hora Uruguay aprox, ajustable abajo)
# y tambien se puede disparar a mano desde la pestana "Actions" en GitHub.
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Instalar navegador para los scrapers Wix
        run: playwright install --with-deps chromium

      - name: Correr los scrapers
        run: python scrapers/run_all.py

      - name: Guardar los datos actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git diff --staged --quiet && echo "Sin cambios" || git commit -m "Actualizar precios $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
