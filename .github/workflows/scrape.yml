name: Actualizar precios y publicar RivFree

on:
  push:
    branches: ["main"]

  schedule:
    # Diario a las 08:15 UTC = 05:15 en Uruguay
    - cron: "15 8 * * *"

  workflow_dispatch:
    inputs:
      actualizar_precios:
        description: "Ejecutar los scrapers antes de publicar"
        type: boolean
        default: false
      tienda:
        description: "Tienda a actualizar (all = todas)"
        type: choice
        default: all
        options:
          - all
          - barao
          - dfa
          - mantra
          - neutral
          - oprha
          - sineriz
          - yurys

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: rivfree-pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      PYTHONUNBUFFERED: "1"

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Verificar lógica y scrapers
        run: |
          python -m unittest discover -s tests -v
          npm ci
          npm test
          npm run test:ui

      - name: Instalar navegador para scrapers
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.actualizar_precios == true)
        run: |
          playwright install --with-deps chromium

      - name: Ejecutar scrapers
        id: scrape
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.actualizar_precios == true)
        timeout-minutes: 150
        shell: bash
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.tienda }}" != "all" ] && [ -n "${{ inputs.tienda }}" ]; then
            echo "Actualizando solamente: ${{ inputs.tienda }}"
            python scrapers/run_all.py --store "${{ inputs.tienda }}" 2>&1 | tee scrape.log
          else
            echo "Actualizando todas las tiendas"
            python scrapers/run_all.py 2>&1 | tee scrape.log
          fi

      - name: Notificar salud por webhook o email
        if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.actualizar_precios == true))
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          HEALTH_FAILURE_THRESHOLD: ${{ vars.HEALTH_FAILURE_THRESHOLD }}
          HEALTH_PARTIAL_THRESHOLD: ${{ vars.HEALTH_PARTIAL_THRESHOLD }}
          SCRAPE_OUTCOME: ${{ steps.scrape.outcome }}
        run: python tools/scraper_health_alerts.py

      # Se ejecuta incluso si el paso de scraping falla o alcanza su timeout.
      # Los JSON individuales que ya terminaron y el log quedan descargables.
      - name: Guardar respaldo del scraping
        if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.actualizar_precios == true))
        uses: actions/upload-artifact@v4
        with:
          name: rivfree-scraping-${{ github.run_id }}
          path: |
            data/
            scrape.log
          if-no-files-found: warn
          retention-days: 7

      - name: Actualizar cotización USD a BRL
        run: |
          python scrapers/update_exchange.py

      - name: Preparar versión y datos públicos
        run: |
          python scrapers/publish_data.py

      - name: Guardar productos actualizados
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.actualizar_precios == true)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/catalog-first-seen.json data/products.json data/meta.json data/exchange.json data/price-history.json data/health.json data/popular.json data/history/ data/products/ data/price-history/

          if git diff --staged --quiet; then
            echo "No hubo cambios en los datos."
            exit 0
          fi

          git commit -m "Actualizar precios"

          # Los cachés por tienda son sólo intermedios. Si aún siguen trackeados
          # en una copia antigua del repo, sus cambios no deben bloquear el rebase.
          git restore -- data/barao.json data/dfa.json data/mantra.json data/neutral.json data/oprha.json data/sineriz.json data/yurys.json debug_barao_output.txt 2>/dev/null || true

          for intento in 1 2 3 4 5; do
            echo "Intento $intento de publicación..."
            git fetch origin main

            if ! git rebase origin/main; then
              echo "No se pudo reaplicar el commit sobre main."
              git rebase --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Datos publicados correctamente."
              exit 0
            fi

            if [ "$intento" -eq 5 ]; then
              echo "No se pudo publicar después de 5 intentos."
              exit 1
            fi

            echo "main cambió durante la publicación; reintentando..."
            sleep 10
          done

      - name: Alertar fallas repetidas
        if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.actualizar_precios == true))
        uses: actions/github-script@v7
        with:
          script: |
            const run = require('./.github/scraper-alerts.cjs');
            await run({github, context});

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos públicos
        run: |
          # Un job en cola o un scrape largo puede haber comenzado antes de
          # la última edición del Studio. Empaquetar siempre main actual.
          git fetch origin main
          mkdir -p _publish_source
          git archive origin/main | tar -x -C _publish_source
          cd _publish_source
          python scrapers/publish_data.py
          python scrapers/update_exchange.py
          mkdir -p ../_site
          # Rutas relativas al checkout fresco, destino fuera del árbol fuente.
          cp *.html *.css *.js manifest.webmanifest social-card.png robots.txt sitemap.xml ../_site/
          cp -r icons ../_site/icons
          mkdir -p ../_site/data
          cp data/products.json data/meta.json data/stores.json data/manual-products.json data/manual-stores.json data/exchange.json data/price-history.json data/highlights.json data/popular.json data/site-config.json ../_site/data/
          if [ -d data/products ]; then cp -r data/products ../_site/data/products; fi
          cp -r data/price-history ../_site/data/price-history
          if [ -d assets/manual ]; then
            mkdir -p ../_site/assets
            cp -r assets/manual ../_site/assets/manual
          fi

      - name: Subir archivos de la página
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      - name: Publicar RivFree
        id: deployment
        uses: actions/deploy-pages@v4
