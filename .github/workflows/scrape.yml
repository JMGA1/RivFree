name: Actualizar precios y publicar RivFree

on:
  push:
    branches: ["main"]

  schedule:
    # Diario a las 08:15 UTC = 05:15 en Uruguay
    - cron: "15 8 * * *"

  workflow_dispatch:
    inputs:
      actualizar_precios:
        description: "Ejecutar los scrapers antes de publicar"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: rivfree-pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Verificar lógica y scrapers
        run: |
          python -m unittest discover -s tests -v
          npm ci
          npm test
          npm run test:ui

      - name: Instalar navegador para scrapers
        if: github.event_name == 'schedule' || inputs.actualizar_precios == true
        run: playwright install --with-deps chromium

      - name: Ejecutar scrapers
        if: github.event_name == 'schedule' || inputs.actualizar_precios == true
        run: python scrapers/run_all.py

      - name: Preparar versión y datos públicos
        run: python scrapers/publish_data.py

      - name: Guardar productos actualizados
        if: github.event_name == 'schedule' || inputs.actualizar_precios == true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --staged --quiet; then
            git commit -m "Actualizar precios"
            git push
          fi

      - name: Alertar fallas repetidas
        if: github.event_name == 'schedule' || inputs.actualizar_precios == true
        uses: actions/github-script@v7
        with:
          script: |
            const run = require('./.github/scraper-alerts.cjs');
            await run({github, context});

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos públicos
        run: |
          mkdir -p _site
          cp index.html styles.css *.js manifest.webmanifest social-card.png _site/
          cp -r icons _site/icons
          mkdir -p _site/data
          cp data/products.json data/meta.json data/stores.json data/exchange.json data/price-history.json _site/data/

      - name: Subir archivos de la página
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      - name: Publicar RivFree
        id: deployment
        uses: actions/deploy-pages@v4